<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ONWAY 배포용 전체 백업</title><style>body{font:16px sans-serif;max-width:640px;margin:40px auto;padding:20px;line-height:1.7;color:#234}button{padding:14px;background:#176b75;color:white;border:0;border-radius:10px;font:inherit}pre{white-space:pre-wrap}</style><h1>배포용 전체 자료 백업</h1><p>현재 브라우저의 단체·일정표·식단표·첨부 자료를 파일로 저장합니다. 기존 자료는 변경되지 않으며 관리자 코드는 포함되지 않습니다.</p><button id="save">전체 자료 백업 파일 만들기</button><pre id="status"></pre><script>
const button=document.querySelector('#save'),status=document.querySelector('#status');
button.onclick=async()=>{button.disabled=true;try{
if(!['127.0.0.1','localhost'].includes(location.hostname))throw Error('자료가 있는 로컬 ONWAY에서 실행해주세요.');
const storage={};for(const key of Object.keys(localStorage))if(key==='onway-workspace-v2'||key==='onway-program-plans-v1'||/^onway-weekly-menu-v1:/.test(key)||/^onway-meal-preview-v1:/.test(key))storage[key]=localStorage.getItem(key);
if(!storage['onway-workspace-v2'])throw Error('이 브라우저에는 단체 자료가 없습니다. 평소 사용한 로컬 브라우저에서 열어주세요.');
const documents=[];const databases=await indexedDB.databases();if(databases.some(d=>d.name==='onway-local-documents')){const db=await new Promise((ok,no)=>{const r=indexedDB.open('onway-local-documents');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});const records=await new Promise((ok,no)=>{const rows=[],tx=db.transaction('documents','readonly'),r=tx.objectStore('documents').openCursor();r.onsuccess=()=>{const c=r.result;if(c){rows.push({key:c.key,bundle:c.value});c.continue()}};tx.oncomplete=()=>ok(rows);tx.onerror=()=>no(tx.error)});db.close();for(const record of records){const bundle={};for(const [kind,value]of Object.entries(record.bundle)){if(!value)continue;const blob=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>no(r.error);r.readAsDataURL(value.blob)});bundle[kind]={...value,blob}}documents.push({key:record.key,bundle})}}
const data={exportedAt:new Date().toISOString(),storage,documents},url=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='ONWAY-full-deployment-backup-'+new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Seoul'})+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);status.textContent='백업 파일을 만들었습니다. 단체 '+JSON.parse(storage['onway-workspace-v2']).groups.length+'개 · 일정표 '+JSON.parse(storage['onway-program-plans-v1']||'[]').length+'개 · 첨부 묶음 '+documents.length+'개';
}catch(e){status.textContent=e.message}finally{button.disabled=false}};
</script></html>
